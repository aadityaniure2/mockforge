openapi: "3.1.0"
info:
  title: Recursive Loop Tree API
  version: "1.0.0"
  description: OpenAPI 3.1 schema containing circular self-referencing nodes
paths:
  /trees:
    get:
      summary: Get hierarchy tree
      responses:
        '200':
          description: A node in a recursive tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
components:
  schemas:
    TreeNode:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        parent:
          $ref: '#/components/schemas/TreeNode'
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
